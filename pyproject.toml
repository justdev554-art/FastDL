[project]
name = "FastDL"
version = "0.1.0"
description = "An intelligent FastDL server implemented in Python, designed to automatically resolve and serve requested files with minimal configuration."
readme = "README.md"
authors = [
    { name = "Monera", email = "monera@docyb.org" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofile>=3.9.0",
    "dacite>=1.9.2",
    "srctools>=2.5.0",
    "starlette>=0.46.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "uvicorn>=0.34.1",
]
docker = [
    "uvicorn>=0.34.1",
]
